<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bloqueado</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e10; color: #ddd; }
      main { max-width: 460px; padding: 24px; text-align: center; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { opacity: 0.75; margin: 6px 0; }
      code { background: #fff1; padding: 2px 6px; border-radius: 4px; }
      button { margin-top: 18px; padding: 10px 22px; font: inherit; border: 0; border-radius: 8px; background: #2d6cdf; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>🚫 Bloqueado</h1>
      <p>Esse conteúdo foi bloqueado pela extensão <b>Sem Pornografia</b>.</p>
      <p id="why"></p>
      <button id="back">Voltar</button>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
